<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#111111"/>
  <!-- Cabinet body -->
  <rect x="7" y="10" width="18" height="14" rx="2" fill="#1f2937" stroke="#facc15" stroke-width="1.5"/>
  <!-- Claw arm (wire down) -->
  <line x1="16" y1="7" x2="16" y2="11" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Claw hooks: two independent hooked fingers, tips stop short of meeting -->
  <polyline points="16,11 18,12.5 17,14" fill="none" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="16,11 14,12.5 15,14" fill="none" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gift box inside machine -->
  <rect x="12" y="17" width="8" height="6" rx="1" fill="#facc15" stroke="#f59e0b" stroke-width="1"/>
  <line x1="16" y1="17" x2="16" y2="23" stroke="#f59e0b" stroke-width="1"/>
  <!-- Bow on gift -->
  <circle cx="16" cy="17" r="1.5" fill="#111111"/>
  <!-- Star sparkle -->
  <text x="6" y="10" font-size="5" fill="#facc15">★</text>
</svg>
